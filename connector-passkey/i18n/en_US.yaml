plugin:
  passkey_connector:
    backend:
      name:
        other: Passkey
      info:
        name:
          other: Passkey Connector
        description:
          other: Sign in with passkeys (WebAuthn / FIDO2)
      config:
        rp_name:
          title:
            other: Relying party name
          description:
            other: Name shown by the browser or password manager when a passkey is created. Leave empty to use the host name of the Site URL.
        rp_id:
          title:
            other: Relying party ID
          description:
            other: Domain that passkeys are bound to, for example example.com. Leave empty to use the host of the Site URL. Changing it makes every existing passkey unusable.
        rp_origins:
          title:
            other: Allowed origins
          description:
            other: Comma-separated origins that may use passkeys, for example https://example.com. Leave empty to use the origin of the Site URL. Each origin must use https (http only for localhost) and be on the relying party ID or one of its subdomains.
      user_config:
        manage_passkeys:
          other: Manage passkeys
    frontend:
      common:
        loading: "Loading…"
        back_to_login: "Back to sign in"
      error:
        bad_request: "The request was invalid. Please reload the page and try again."
        unauthorized: "Please sign in first."
        forbidden: "Your account cannot perform this action."
        plugin_disabled: "Passkey sign-in is disabled on this site."
        not_configured: "Passkey sign-in is not configured on this site yet."
        state_required: "This link is incomplete. Please start again."
        state_unverified: "This sign-in link was not started from this site. Start signing in again from the sign-in page."
        session_invalid: "This request has expired. Please try again."
