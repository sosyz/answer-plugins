plugin:
  passkey_connector:
    backend:
      name:
        other: 通行密钥
      info:
        name:
          other: 通行密钥连接器
        description:
          other: 使用通行密钥（WebAuthn / FIDO2）登录
      config:
        rp_name:
          title:
            other: 依赖方名称
          description:
            other: 创建通行密钥时浏览器或密码管理器显示的名称。留空则使用站点 URL 的主机名。
        rp_id:
          title:
            other: 依赖方 ID
          description:
            other: 通行密钥绑定的域名，例如 example.com。留空则使用站点 URL 的主机名。修改后，所有已有的通行密钥都将无法使用。
        rp_origins:
          title:
            other: 允许的来源
          description:
            other: 允许使用通行密钥的来源，以逗号分隔，例如 https://example.com。留空则使用站点 URL 的来源。每个来源都必须使用 https（仅 localhost 可使用 http），并且位于依赖方 ID 或其子域名下。
      user_config:
        manage_passkeys:
          other: 管理通行密钥
